services:
  - type: web
    name: resume-parser-backend
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DEBUG
        value: "False"
      - key: GEMINI_MODEL
        value: "gemini-3.5-flash-lite"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
