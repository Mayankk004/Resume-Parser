services:
  - type: web
    name: resume-parser-backend
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DEBUG
        value: "False"
      - key: GEMINI_MODEL
        value: "gemini-3.5-flash-lite"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: ALLOWED_ORIGINS
        value: "https://resume-parser-ai-five.vercel.app,http://localhost:3000"
      - key: AWS_REGION
        value: "us-east-2"
      - key: NEON_STORAGE_BUCKET
        value: "assets"
      - key: AWS_ENDPOINT_URL_S3
        value: "https://br-autumn-dawn-bebernfv.storage.c-9.us-east-2.aws.neon.tech"
      - key: NEON_REALTIME_URL
        value: "wss://ep-crimson-glade-beoeiidk.rt.c-9.us-east-2.aws.neon.tech/"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: NEON_REALTIME_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
